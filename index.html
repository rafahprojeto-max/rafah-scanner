<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#57327d">
  <title>RAFAH | Leitor de QR</title>
  <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1FnpwQe6kxkKXXDtwhdjqCQrjUX98Cu-f&sz=w192">
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{--roxo:#57327d;--escuro:#372047;--amarelo:#f4d35e;--fundo:#f7f5fa;--verde:#d6f1df;--vermelho:#ffe0e0;--borda:#e7e0ed}
    *{box-sizing:border-box} body{margin:0;background:var(--fundo);color:#292331;font:15px Arial,sans-serif;-webkit-tap-highlight-color:transparent}
    header{background:#fff;border-bottom:4px solid var(--amarelo);text-align:center;padding:8px 12px} header img{width:150px;max-width:45vw;height:auto;display:block;margin:auto}
    header div{font-size:11px;font-weight:bold;letter-spacing:1.4px;color:var(--roxo);text-transform:uppercase;margin-top:2px}
    main{width:min(100%,560px);margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:14px;margin-bottom:11px;box-shadow:0 5px 18px rgba(55,32,71,.05)}
    h1{font-size:21px;color:var(--escuro);margin:0 0 4px}.muted{color:#756c7d;font-size:12px}.reader{overflow:hidden;border-radius:14px;background:#111;min-height:310px}.reader video{object-fit:cover}
    button,input{width:100%;border-radius:10px;font:inherit;padding:13px}input{border:1px solid #dcd5e5;margin:7px 0 10px;background:#fff}button{border:0;background:var(--roxo);color:#fff;font-weight:bold;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.98)}
    .secondary{background:#eee8f4;color:var(--roxo)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.resultado{display:none;border-left:6px solid var(--roxo)}.resultado.ok{display:block;background:#f0fff4;border-left-color:#38a169}.resultado.aviso{display:block;background:#fff9df;border-left-color:#d69e2e}.resultado.erro{display:block;background:#fff2f2;border-left-color:#d64545}.nome{font-size:20px;font-weight:bold;margin-bottom:5px}.status{font-weight:bold}.pequeno{font-size:12px;color:#756c7d;margin-top:5px}
    #abrirCamera{display:none;margin-top:9px}.top-status{display:flex;align-items:center;justify-content:space-between;gap:8px}.bolinha{width:10px;height:10px;border-radius:50%;background:#aaa;display:inline-block;margin-right:6px}.bolinha.on{background:#38a169}.bolinha.busy{background:#d69e2e}
    @media(max-width:420px){main{padding:8px}.card{padding:11px}.reader{min-height:280px}}
  </style>
</head>
<body>
<header>
  <img src="https://drive.google.com/thumbnail?id=1FnpwQe6kxkKXXDtwhdjqCQrjUX98Cu-f&sz=w600" alt="Projeto RAFAH">
  <div>Leitor rápido de ingressos</div>
</header>
<main>
  <section class="card">
    <div class="top-status">
      <div><h1>Check-in</h1><div class="muted">Aponte a câmera para o QR Code.</div></div>
      <div class="muted"><span id="bolinha" class="bolinha"></span><span id="estadoCamera">iniciando</span></div>
    </div>
    <div id="reader" class="reader"></div>
    <button id="abrirCamera" onclick="iniciarCamera()">Abrir câmera</button>
  </section>

  <section id="resultado" class="card resultado" aria-live="polite"></section>

  <section class="card">
    <div class="muted">Se o QR não puder ser lido, use o código impresso no ingresso.</div>
    <label for="turma" class="pequeno">Turma</label>
    <input id="turma" placeholder="DD-MM-AAAA" inputmode="numeric">
    <label for="codigo" class="pequeno">Código do ingresso</label>
    <input id="codigo" placeholder="Ex.: RAFABC123XYZ" autocomplete="off" autocapitalize="characters">
    <button onclick="checkinManual()">Registrar presença</button>
  </section>
</main>
<script>
  const API='https://script.google.com/macros/s/AKfycbz8ZlQNGXwGNX6ReZ2gYNR-DeGKrr9OAXKry4cF5A1B0U4txDhXtvHJqx8WZjWHWgjX/exec';
  const $=id=>document.getElementById(id);
  let leitor=null, iniciado=false, enviando=false, ultimoValor='', ultimoEm=0;
  const params=new URLSearchParams(location.search);
  $('turma').value=params.get('turma')||'18-10-2026';

  function setCamera(texto,classe=''){$('estadoCamera').textContent=texto;$('bolinha').className='bolinha '+classe;}
  function mostrar(tipo,titulo,mensagem,extra=''){
    const el=$('resultado');el.className='card resultado '+tipo;
    el.innerHTML=`<div class="nome">${esc(titulo)}</div><div class="status">${esc(mensagem)}</div>${extra?`<div class="pequeno">${esc(extra)}</div>`:''}`;
  }
  function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
  function interpretar(valor){
    const raw=String(valor||'').trim();
    if(raw.startsWith('RAFAH|')){const p=raw.split('|');if(p.length===3)return{turma:p[1],valor:raw,codigo:p[2]};}
    return{turma:$('turma').value.trim(),valor:raw,codigo:raw};
  }
  function bip(ok=true){try{navigator.vibrate?.(ok?[80]:[100,60,100]);const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?880:250;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.09);}catch(e){}}
  async function iniciarCamera(){
    if(iniciado)return;
    if(typeof Html5Qrcode==='undefined'){mostrar('erro','Leitor indisponível','Não foi possível carregar o leitor de QR.');return;}
    $('abrirCamera').style.display='none';setCamera('abrindo','busy');
    try{
      leitor=leitor||new Html5Qrcode('reader',false);
      await leitor.start({facingMode:'environment'},{fps:12,qrbox:(vw,vh)=>{const s=Math.floor(Math.min(vw,vh)*.72);return{width:s,height:s}},aspectRatio:1.333333},onScan,()=>{});
      iniciado=true;setCamera('câmera ativa','on');
    }catch(e){
      iniciado=false;setCamera('toque para abrir');$('abrirCamera').style.display='block';
      mostrar('aviso','Câmera não abriu','Toque em “Abrir câmera” e permita o acesso à câmera.');
    }
  }
  function onScan(valor){
    const agora=Date.now();if(enviando||(valor===ultimoValor&&agora-ultimoEm<2500))return;
    ultimoValor=valor;ultimoEm=agora;enviar(valor);
  }
  function checkinManual(){const valor=$('codigo').value.trim();if(!valor){mostrar('erro','Código ausente','Digite o código do ingresso.');return;}enviar(valor);}
  function enviar(valor){
    if(enviando)return;const d=interpretar(valor);
    if(!/^\d{2}-\d{2}-\d{4}$/.test(d.turma)){mostrar('erro','Turma inválida','Informe a turma no formato DD-MM-AAAA.');return;}
    if(!d.valor){mostrar('erro','Código ausente','Leia ou digite o código do ingresso.');return;}
    enviando=true;setCamera('registrando','busy');try{if(iniciado)leitor.pause(true);}catch(e){}
    $('turma').value=d.turma;mostrar('aviso','Aguarde','Registrando presença...');
    jsonp(d.valor,d.turma).then(res=>{
      if(!res.ok)throw new Error(res.erro||'Não foi possível registrar.');
      const r=res.resultado;$('codigo').value='';bip(true);
      mostrar(r.jaRegistrado?'aviso':'ok',r.nome,r.mensagem,r.presenca||'');
    }).catch(e=>{bip(false);mostrar('erro','Não registrado',e.message||String(e));})
      .finally(()=>{enviando=false;setTimeout(()=>{try{if(iniciado)leitor.resume();setCamera('câmera ativa','on');}catch(e){setCamera('toque para abrir');$('abrirCamera').style.display='block';}},850);});
  }
  function jsonp(valor,turma){return new Promise((resolve,reject)=>{
    const cb='rafahCb_'+Date.now()+'_'+Math.floor(Math.random()*100000);const script=document.createElement('script');let acabou=false;
    const limpar=()=>{delete window[cb];script.remove();};
    window[cb]=r=>{if(acabou)return;acabou=true;clearTimeout(timer);limpar();resolve(r);};
    script.onerror=()=>{if(acabou)return;acabou=true;clearTimeout(timer);limpar();reject(new Error('Não foi possível acessar o sistema RAFAH.'));};
    script.src=API+'?api=checkin&callback='+encodeURIComponent(cb)+'&turma='+encodeURIComponent(turma)+'&valor='+encodeURIComponent(valor)+'&_='+Date.now();
    document.head.appendChild(script);
    const timer=setTimeout(()=>{if(acabou)return;acabou=true;limpar();reject(new Error('O sistema demorou para responder. Tente novamente.'));},12000);
  });}
  window.addEventListener('load',()=>setTimeout(iniciarCamera,120));
</script>
</body>
</html>
